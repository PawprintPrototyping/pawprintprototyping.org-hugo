name: Deploy to server

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Production deploys serialize across every ref; cancelling mid-upload would leave a half-written deploy directory behind.
concurrency:
  group: bunny-sites
  cancel-in-progress: false
       
jobs:
  deploy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      deployments: write # records the deploy in the repo's Environments
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.143.0'
          extended: true

      - name: Build
        run: hugo --minify
      
      - uses: BunnyWay/actions/deploy-site@deploy-site_0.1.2
        with:
          site: "pawprintprototyping-org"
          directory: "public"
          api_key: ${{ secrets.BUNNYNET_API_KEY }}

      - name: Deploy to cloud server
        uses: easingthemes/ssh-deploy@v6.0.1
        env:
            SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
            ARGS: "-rltgoDzvO --delete"
            SOURCE: "public/"
            REMOTE_HOST: ${{ secrets.PROD_REMOTE_HOST }}
            REMOTE_USER: ${{ secrets.PROD_REMOTE_USER }}
            TARGET: ${{ secrets.PROD_REMOTE_TARGET }}
